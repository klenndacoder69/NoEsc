# NoEsc ML Process Whitelist Configuration
#
# Executables listed here will be SKIPPED by the ML engine during inference.
# The rule-based engine is NOT affected — it will still evaluate these processes.
#
# This reduces false positives from known system processes whose syscall
# patterns resemble attack signatures in the TF-IDF feature space.
#
# Format: one executable path per line. Lines starting with '#' are comments.
# Supports exact paths and prefix matching (trailing '/').
#
# Examples:
#   /usr/bin/snap         — exact match
#   /snap/                — prefix match (any exe starting with /snap/)

# --- System mount/fuse utilities (top FP source: short privileged syscall bursts) ---
/usr/bin/fuser
/usr/bin/fusermount3
/usr/bin/fusermount

# --- System package managers ---
/usr/bin/snap
/usr/lib/snapd/snap-update-ns
/usr/lib/snapd/snap-confine
/usr/lib/snapd/snapd
/usr/lib/snapd/snapctl
/snap/

# --- Display / session managers ---
/usr/libexec/gdm-session-worker
/usr/libexec/gsd-housekeeping
/usr/libexec/gsd-a11y-settings
/usr/libexec/gsd-screensaver-proxy
/usr/libexec/gsd-wacom
/usr/libexec/xdg-document-portal

# --- Systemd internals ---
/usr/lib/systemd/systemd-executor
/usr/lib/systemd/systemd-logind
/usr/lib/systemd/systemd-resolved
/usr/lib/systemd/systemd-timesyncd
/usr/bin/systemd-tty-ask-password-agent

# --- Firewall / networking ---
/usr/sbin/xtables-nft-multi
/usr/sbin/iptables
/usr/sbin/ip6tables
/usr/sbin/nft

# --- Scheduled tasks ---
/usr/sbin/cron
/usr/sbin/atd
/usr/sbin/anacron

# --- Security subsystem ---
/sbin/apparmor_parser
/usr/sbin/apparmor_parser
/usr/sbin/auditctl

# --- Desktop services ---
/usr/bin/dbus-daemon
/usr/bin/gnome-keyring-daemon
/usr/bin/session-migration
/usr/bin/xdg-user-dirs-update
/usr/bin/gjs-console
/usr/bin/ubuntu-report
